basePath: /
definitions:
  config.Difficulty:
    enum:
    - easy
    - medium
    - hard
    - deadly
    type: string
    x-enum-varnames:
    - DIFFICULTY_EASY
    - DIFFICULTY_MEDIUM
    - DIFFICULTY_HARD
    - DIFFICULTY_DEADLY
  ent.Combatant:
    properties:
      ac:
        description: Armor Class
        type: integer
      cr:
        description: Challenge Rating, e.g., 1.25
        type: number
      damage:
        description: Damage as decimal, e.g., 45.6
        type: number
      dc:
        description: Difficulty Class
        type: integer
      edges:
        allOf:
        - $ref: '#/definitions/ent.CombatantEdges'
        description: |-
          Edges holds the relations/edges for other nodes in the graph.
          The values are being populated by the CombatantQuery when eager-loading is set.
      hit_dice:
        description: Hit dice as string, e.g., '2d8+2'
        type: string
      hp:
        description: Hit Points
        type: integer
      id:
        description: ID of the ent.
        type: string
      is_boss:
        description: Whether this combatant is a boss
        type: boolean
      is_legendary:
        description: Whether this combatant is legendary
        type: boolean
      name:
        description: Name holds the value of the "name" field.
        type: string
      speed_mod:
        description: Speed modifier, can be negative
        type: integer
    type: object
  ent.CombatantEdges:
    properties:
      encounter_combatants:
        description: EncounterCombatants holds the value of the encounter_combatants
          edge.
        items:
          $ref: '#/definitions/ent.EncounterCombatant'
        type: array
    type: object
  ent.Encounter:
    properties:
      edges:
        allOf:
        - $ref: '#/definitions/ent.EncounterEdges'
        description: |-
          Edges holds the relations/edges for other nodes in the graph.
          The values are being populated by the EncounterQuery when eager-loading is set.
      external_id:
        description: ExternalID holds the value of the "external_id" field.
        type: string
      game_id:
        description: GameID holds the value of the "game_id" field.
        type: string
      id:
        description: ID of the ent.
        type: string
      name:
        description: Name holds the value of the "name" field.
        type: string
      state:
        allOf:
        - $ref: '#/definitions/models.EncounterState'
        description: State holds the value of the "state" field.
    type: object
  ent.EncounterCombatant:
    properties:
      combatant_id:
        description: Reference to the combatant
        type: string
      edges:
        allOf:
        - $ref: '#/definitions/ent.EncounterCombatantEdges'
        description: |-
          Edges holds the relations/edges for other nodes in the graph.
          The values are being populated by the EncounterCombatantQuery when eager-loading is set.
      encounter_id:
        description: Reference to the encounter
        type: string
      id:
        description: ID of the ent.
        type: string
      is_enemy:
        description: Whether this combatant is an enemy
        type: boolean
      is_friendly:
        description: Whether this combatant is friendly
        type: boolean
      is_party_member:
        description: Whether this combatant is a party member
        type: boolean
    type: object
  ent.EncounterCombatantEdges:
    properties:
      combatant:
        allOf:
        - $ref: '#/definitions/ent.Combatant'
        description: Combatant holds the value of the combatant edge.
      encounter:
        allOf:
        - $ref: '#/definitions/ent.Encounter'
        description: Encounter holds the value of the encounter edge.
    type: object
  ent.EncounterEdges:
    properties:
      encounter_combatants:
        description: EncounterCombatants holds the value of the encounter_combatants
          edge.
        items:
          $ref: '#/definitions/ent.EncounterCombatant'
        type: array
      game:
        allOf:
        - $ref: '#/definitions/ent.Game'
        description: Game holds the value of the game edge.
    type: object
  ent.Game:
    properties:
      edges:
        allOf:
        - $ref: '#/definitions/ent.GameEdges'
        description: |-
          Edges holds the relations/edges for other nodes in the graph.
          The values are being populated by the GameQuery when eager-loading is set.
      id:
        description: ID of the ent.
        type: string
      name:
        description: Name holds the value of the "name" field.
        type: string
      owner_id:
        description: ID of the user who owns this game
        type: string
    type: object
  ent.GameEdges:
    properties:
      encounters:
        description: Encounters holds the value of the encounters edge.
        items:
          $ref: '#/definitions/ent.Encounter'
        type: array
      players:
        description: Players holds the value of the players edge.
        items:
          $ref: '#/definitions/ent.User'
        type: array
      user:
        allOf:
        - $ref: '#/definitions/ent.User'
        description: User holds the value of the user edge.
    type: object
  ent.User:
    properties:
      edges:
        allOf:
        - $ref: '#/definitions/ent.UserEdges'
        description: |-
          Edges holds the relations/edges for other nodes in the graph.
          The values are being populated by the UserQuery when eager-loading is set.
      email:
        description: Email holds the value of the "email" field.
        type: string
      id:
        description: ID of the ent.
        type: string
      name:
        description: Name holds the value of the "name" field.
        type: string
      verified:
        description: Verified holds the value of the "verified" field.
        type: boolean
    type: object
  ent.UserEdges:
    properties:
      games:
        description: Games holds the value of the games edge.
        items:
          $ref: '#/definitions/ent.Game'
        type: array
    type: object
  models.EncounterState:
    properties:
      id:
        type: string
      order:
        items:
          $ref: '#/definitions/models.InitiativeTrackerCombatant'
        type: array
    type: object
  models.InitiativeTrackerCombatant:
    properties:
      ac:
        type: string
      active:
        type: boolean
      cr:
        type: integer
      current_ac:
        type: integer
      current_max:
        type: integer
      dirty_ac:
        type: boolean
      display:
        type: string
      enabled:
        type: boolean
      friendly:
        type: boolean
      hidden:
        type: boolean
      hp:
        type: integer
      id:
        type: string
      initiative:
        type: integer
      level:
        type: integer
      manualOrder:
        type: integer
      max:
        type: integer
      modifier:
        type: integer
      name:
        type: string
      note:
        type: string
      number:
        type: integer
      player:
        type: boolean
      status:
        items:
          type: string
        type: array
      temp:
        type: integer
    type: object
  requests.CalculateEncounterCRsRequest:
    properties:
      difficulty:
        $ref: '#/definitions/config.Difficulty'
      monsters:
        items:
          $ref: '#/definitions/requests.Monster'
        type: array
      partyLevel:
        type: integer
      partySize:
        type: integer
    type: object
  requests.GameCreationRequest:
    properties:
      name:
        type: string
    type: object
  requests.Monster:
    properties:
      adjustment:
        type: integer
      cr:
        type: string
      xp:
        type: integer
    type: object
  requests.UserCreationRequest:
    properties:
      email:
        type: string
      name:
        type: string
    type: object
  responses.RecommendedStatsResponse:
    properties:
      ac:
        type: integer
      attackModifier:
        type: integer
      avarageDamage:
        type: integer
      cr:
        type: string
      dc:
        type: integer
      hp:
        type: integer
    type: object
  responses.SpellSlotsPerCrResponse:
    properties:
      cr:
        type: string
      slots:
        items:
          $ref: '#/definitions/responses.Spells'
        type: array
    type: object
  responses.Spells:
    properties:
      amount:
        type: integer
      level:
        type: integer
    type: object
host: localhost:8080
info:
  contact: {}
  description: These endpoints can help you game master for dnd5e (atm)
  title: Backend for a gm toolkit
  version: 1.0.0
paths:
  /{userId}/game:
    post:
      consumes:
      - application/json
      parameters:
      - description: The ID of the user creating the game
        in: path
        name: userId
        required: true
        type: string
      - description: Game name to be created
        in: body
        name: game
        required: true
        schema:
          $ref: '#/definitions/requests.GameCreationRequest'
      produces:
      - text/plain
      responses:
        "201":
          description: UUID of the newly created game
          schema:
            type: string
        "400":
          description: Game could not be created
          schema:
            type: string
      summary: Create a game for the given user id
      tags:
      - game
  /encounter-calculator:
    post:
      consumes:
      - application/json
      description: Calculate the appropriate Challenge Rating for monsters in a D&D
        5e encounter based on party size, level, and difficulty
      parameters:
      - description: Encounter CR calculation request
        in: body
        name: encounter
        required: true
        schema:
          $ref: '#/definitions/requests.CalculateEncounterCRsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Calculated monster CRs and XP values
          schema:
            items:
              $ref: '#/definitions/requests.Monster'
            type: array
        "400":
          description: Bad request - invalid request format or calculation error
          schema:
            type: string
      summary: Calculate monster CR for encounter
      tags:
      - encounter-calculator
  /encounter-calculator/recommend/spell-slots:
    get:
      consumes:
      - application/json
      parameters:
      - in: query
        name: cr
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Calculated spell slots for the given CR
          schema:
            items:
              $ref: '#/definitions/responses.SpellSlotsPerCrResponse'
            type: array
        "400":
          description: Bad request - invalid request format or calculation error
          schema:
            type: string
      summary: Get recommended spell slots for an enemy of the given CR
      tags:
      - encounter-calculator
  /encounter-calculator/recommend/stats:
    get:
      consumes:
      - application/json
      parameters:
      - in: query
        name: cr
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Calculated stats for the given CR
          schema:
            items:
              $ref: '#/definitions/responses.RecommendedStatsResponse'
            type: array
        "400":
          description: Bad request - invalid request format or calculation error
          schema:
            type: string
      summary: Get recommended stats for an enemy of the given CR
      tags:
      - encounter-calculator
  /user:
    post:
      consumes:
      - application/json
      description: Create a new user with name and email
      parameters:
      - description: User creation request
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/requests.UserCreationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: User created successfully
          schema:
            $ref: '#/definitions/ent.User'
        "400":
          description: Bad request - user couldn't be created
          schema:
            type: string
      summary: Create a new user
      tags:
      - users
swagger: "2.0"
